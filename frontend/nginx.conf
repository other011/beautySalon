server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # REST API (and Swagger UI at /api/docs) -> backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # App and API share one origin here, so any public hostname (tunnel, domain, LAN IP) works
        # without listing it in CORS_ORIGINS: the backend must not treat these calls as cross-origin.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # single page application: unknown paths go to index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
