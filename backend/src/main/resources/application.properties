quarkus.application.name=salon-backend
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=2M

# --- Database -------------------------------------------------------------
# In dev/test no URL is configured on purpose: Quarkus Dev Services starts a throw-away PostgreSQL container.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16-alpine
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}

# The schema is owned by Flyway; Hibernate neither creates nor validates it.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true

# Behind the nginx reverse proxy: use X-Forwarded-For so login rate limiting sees the real client address.
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.allow-x-forwarded=true

# --- CORS -----------------------------------------------------------------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-max-age=24H

# --- Security / JWT ---------------------------------------------------------
# JWT_SECRET is mandatory in production (>= 32 chars). Dev/test use a fixed, non-secret value.
salon.jwt.secret=${JWT_SECRET}
%dev.salon.jwt.secret=dev-only-secret-change-me-0123456789abcdef
%test.salon.jwt.secret=test-only-secret-change-me-0123456789abcdef
salon.jwt.issuer=salon-app
salon.jwt.ttl-minutes=1440
salon.jwt.remember-ttl-minutes=43200
salon.login.max-attempts=5
salon.login.max-attempts-per-ip=40
salon.login.window-minutes=15

# Public (no account) bookings: abuse limits
salon.guest.max-per-ip-hour=10
salon.guest.max-per-phone-day=5
%test.salon.guest.max-per-ip-hour=1000

# --- Demo data ---------------------------------------------------------------
salon.seed.enabled=${SEED_DEMO_DATA:false}
%dev.salon.seed.enabled=true
%test.salon.seed.enabled=true

# --- OpenAPI / Swagger -------------------------------------------------------
quarkus.smallrye-openapi.path=/api/openapi
quarkus.smallrye-openapi.info-title=Salon Booking API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for the beauty salon management and booking application. Authenticate with POST /api/auth/login and send the token as "Authorization: Bearer <token>".
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/docs

quarkus.log.category."ro.salon".level=INFO
